name: Fetch AGD product images

on:
  push:
    branches: ['claude/**']
    paths: ['scripts/agd-images/**', '.github/workflows/agd-images.yml']
  workflow_dispatch:
    inputs:
      force:
        description: 'Pobierz ponownie wszystkie zdjęcia (1 = tak)'
        default: '0'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch images
        run: node scripts/agd-images/fetch.mjs
        env:
          FORCE: ${{ inputs.force || '0' }}

      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add public/agd/img
          git diff --cached --quiet && echo "Brak nowych zdjęć" && exit 0
          git commit -m "chore: fetch AGD product images"
          git pull --rebase
          git push
